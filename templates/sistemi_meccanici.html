<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <title>Sistemi Meccanici - Spazio di Stato</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    :root {
      --kb-bg: rgba(15, 23, 42, 0.9);
      --key-bg: rgba(255, 255, 255, 0.1);
      --key-hover: rgba(255, 255, 255, 0.2);
      --accent-blue: #38bdf8;
      --accent-purple: #a855f7;
      --text-main: #f8fafc;
    }

    .math-keyboard {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 900px;
      background: var(--kb-bg);
      backdrop-filter: blur(15px);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px 20px 0 0;
      padding: 15px;
      box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.5);
      z-index: 2000;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .math-keyboard.hidden {
      transform: translate(-50%, 100%);
    }

    .keyboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      color: var(--text-main);
    }

    .keyboard-row {
      display: flex;
      gap: 6px;
      margin-bottom: 6px;
      justify-content: center;
    }

    .math-key {
      flex: 1;
      height: 48px;
      border: none;
      border-radius: 8px;
      background: var(--key-bg);
      color: var(--text-main);
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .math-key:hover {
      background: var(--key-hover);
    }

    .math-key.fn {
      color: var(--accent-blue);
    }

    .math-key.var {
      color: var(--accent-purple);
      font-style: italic;
    }

    .math-key.op {
      background: rgba(56, 189, 248, 0.1);
      color: var(--accent-blue);
    }

    .math-key.ctrl {
      background: rgba(239, 68, 68, 0.1);
      color: #f87171;
    }

    .math-key.wide {
      flex: 1.5;
    }

    .kb-toggle {
      background: var(--accent-blue);
      color: white;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 2px 8px;
      cursor: pointer;
      margin-left: 5px;
      font-size: 16px;
      vertical-align: middle;
      transition: all 0.3s ease;
    }
    
    .kb-toggle.inactive {
      background: #6c757d;
      opacity: 0.7;
    }

    textarea.math-input {
        background: #1e293b;
        color: white;
        border: 1px solid #334155;
        border-radius: 8px;
        padding: 12px;
        font-family: 'Courier New', Courier, monospace;
        font-size: 18px;
        width: 100%;
        min-height: 120px;
        resize: vertical;
    }

    .step-title {
        color: var(--accent-blue);
        font-weight: bold;
        margin-top: 20px;
        font-size: 1.1rem;
    }

    .centered-math {
        background: rgba(255, 255, 255, 0.03);
        border-radius: 12px;
        padding: 20px;
        margin: 10px 0;
        overflow-x: auto;
    }
  </style>
</head>

<body>
  <div id="sidebar-placeholder"></div>
  <script>
    fetch('/static/partials/sidebar.html')
      .then(res => res.text())
      .then(html => {
        document.getElementById('sidebar-placeholder').innerHTML = html;
        window.openNav = function () {
          const sidebar = document.getElementById("mySidebar");
          if (sidebar) sidebar.style.width = "250px";
        };
        window.closeNav = function () {
          const sidebar = document.getElementById("mySidebar");
          if (sidebar) sidebar.style.width = "0";
        };
      });
  </script>

  <div id="main">
    <div style="display: flex; align-items: flex-start; gap: 10px; margin-bottom: 20px;">
      <button class="openbtn" onclick="openNav()">☰</button>
      <div>
        <h2 style="margin: 0; font-size: 25px;">Sistemi Meccanici: Spazio di Stato</h2>
        <p class="description" style="margin-bottom: 0;">
          Inserisci le equazioni di Lagrange del sistema. Usa <b>q1, q2...</b> per le coordinate, 
          <b>\dot q1</b> per le velocità e <b>\ddot q1</b> per le accelerazioni.
        </p>
      </div>
    </div>

    <div class="container">
      <main class="content">
        <div class="input-section mb-4">
            <label for="equazioniText" class="form-label text-white">Equazioni (una per riga):</label>
            <textarea id="equazioniText" class="math-input" placeholder="m1*ddot q1 + k1*q1 = u..." readonly></textarea>
            <div class="mt-2 text-end">
                <button class="kb-toggle" onclick="toggleKeyboardMode()" title="Attiva/Disattiva tastiera">⌨️</button>
            </div>
        </div>

        <div class="text-center">
            <button class="btn btn-primary px-5 py-2" onclick="calcolaSpazioStato()">Calcola Matrice A e B</button>
        </div>

        <div id="output" class="output mt-4">
          <p style="text-align:center; color:#888; font-style:italic;">I risultati appariranno qui...</p>
        </div>
      </main>
    </div>
  </div>

  <!-- Tastiera Meccanica -->
  <div id="math-keyboard" class="math-keyboard hidden">
    <div class="keyboard-header">
      <span style="font-weight: bold; margin-left: 10px;">Tastiera Sistemi Meccanici</span>
      <button onclick="toggleKeyboard()" class="btn btn-sm btn-outline-danger">Chiudi</button>
    </div>

    <div class="keyboard-body">
      <!-- Variabili di stato -->
      <div class="keyboard-row">
        <button class="math-key var" onclick="insertMath('q1')">q₁</button>
        <button class="math-key var" onclick="insertMath('q2')">q₂</button>
        <button class="math-key var" onclick="insertMath('q3')">q₃</button>
        <button class="math-key var" onclick="insertMath('q4')">q₄</button>
        <button class="math-key op" onclick="insertMath('=')">=</button>
        <button class="math-key ctrl" onclick="backspace()">⌫</button>
      </div>
      <!-- Derivate prime -->
      <div class="keyboard-row">
        <button class="math-key var" onclick="insertMath('\\dot q1')">q̇₁</button>
        <button class="math-key var" onclick="insertMath('\\dot q2')">q̇₂</button>
        <button class="math-key var" onclick="insertMath('\\dot q3')">q̇₃</button>
        <button class="math-key var" onclick="insertMath('\\dot q4')">q̇₄</button>
        <button class="math-key op" onclick="insertMath('(')">(</button>
        <button class="math-key op" onclick="insertMath(')')">)</button>
      </div>
      <!-- Derivate seconde -->
      <div class="keyboard-row">
        <button class="math-key var" onclick="insertMath('\\ddot q1')">q̈₁</button>
        <button class="math-key var" onclick="insertMath('\\ddot q2')">q̈₂</button>
        <button class="math-key op" onclick="insertMath('+')">+</button>
        <button class="math-key op" onclick="insertMath('-')">−</button>
        <button class="math-key op" onclick="insertMath('*')">×</button>
        <button class="math-key op" onclick="insertMath('^2')">x²</button>
      </div>
      <!-- Parametri -->
      <div class="keyboard-row">
        <button class="math-key fn" onclick="insertMath('m1')">m₁</button>
        <button class="math-key fn" onclick="insertMath('m2')">m₂</button>
        <button class="math-key fn" onclick="insertMath('m3')">m₃</button>
        <button class="math-key fn" onclick="insertMath('m4')">m₄</button>
        <button class="math-key fn" onclick="insertMath('u')">u</button>
        <button class="math-key op" onclick="insertMath('\\frac{}{}')">frac</button>
      </div>
      <div class="keyboard-row">
        <button class="math-key fn" onclick="insertMath('k1')">k₁</button>
        <button class="math-key fn" onclick="insertMath('k2')">k₂</button>
        <button class="math-key fn" onclick="insertMath('d1')">d₁</button>
        <button class="math-key fn" onclick="insertMath('d2')">d₂</button>
        <button class="math-key ctrl wide" onclick="clearInput()">CLEAR</button>
      </div>
      <div class="keyboard-row">
          <button class="math-key op wide" style="background: var(--accent-blue); color: white;" onclick="calcolaSpazioStato(); toggleKeyboard();">INVIA</button>
      </div>
    </div>
  </div>

  <script>
    let isKeyboardActive = true;
    let activeInput = document.getElementById('equazioniText');

    function toggleKeyboardMode() {
      isKeyboardActive = !isKeyboardActive;
      const keyboard = document.getElementById('math-keyboard');
      const input = document.getElementById('equazioniText');
      const toggleBtn = document.querySelector('.kb-toggle');

      if (isKeyboardActive) {
        input.setAttribute('readonly', true);
        toggleBtn.classList.remove('inactive');
      } else {
        input.removeAttribute('readonly');
        toggleBtn.classList.add('inactive');
        keyboard.classList.add('hidden');
        input.focus();
      }
    }

    function toggleKeyboard() {
      document.getElementById('math-keyboard').classList.add('hidden');
    }

    document.getElementById('equazioniText').addEventListener('focus', function() {
      if (isKeyboardActive) {
        document.getElementById('math-keyboard').classList.remove('hidden');
      }
    });

    function insertMath(val) {
      const start = activeInput.selectionStart;
      const end = activeInput.selectionEnd;
      const text = activeInput.value;
      let insertion = val;
      let cursorOffset = 0;

      if (val === '\\frac{}{}') {
        insertion = '/()'; // Simplificazione per l'utente, il backend gestisce frazioni se necessario o l'utente scrive /
      }

      activeInput.value = text.substring(0, start) + insertion + text.substring(end);
      const newPos = start + insertion.length + cursorOffset;
      activeInput.setSelectionRange(newPos, newPos);
      activeInput.focus();
    }

    function backspace() {
      const start = activeInput.selectionStart;
      if (start > 0) {
        activeInput.value = activeInput.value.substring(0, start - 1) + activeInput.value.substring(activeInput.selectionEnd);
        activeInput.setSelectionRange(start - 1, start - 1);
      }
      activeInput.focus();
    }

    function clearInput() {
      activeInput.value = "";
      activeInput.focus();
    }

    function calcolaSpazioStato() {
      const text = document.getElementById('equazioniText').value;
      const eqs = text.split('\n').filter(line => line.trim() !== "");
      
      if (eqs.length === 0) {
          alert("Inserisci almeno un'equazione.");
          return;
      }

      const out = document.getElementById('output');
      out.innerHTML = '<p style="text-align:center; color:#888;">Calcolo in corso...</p>';

      fetch('/api/sistemi-meccanici', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ equazioni: eqs })
      })
      .then(r => r.json())
      .then(res => {
        if (res.success) {
          let html = "";
          res.latex.forEach(step => {
            html += `<p class="step-title">${step.title}</p>`;
            html += `<div class="centered-math">\\[ ${step.content} \\]</div>`;
          });
          out.innerHTML = html;
          MathJax.typesetPromise([out]);
        } else {
          out.innerHTML = `<p style="color:#f87171; text-align:center;">Errore: ${res.errore}</p>`;
        }
      })
      .catch(err => {
        out.innerHTML = `<p style="color:#f87171; text-align:center;">Errore di connessione: ${err.message}</p>`;
      });
    }

    // Mostra la tastiera all'inizio se attiva
    window.onload = () => {
        if (isKeyboardActive) {
            document.getElementById('math-keyboard').classList.remove('hidden');
        }
    };
  </script>
</body>
</html>
