<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <title>Da Delta a Sistema</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    :root {
      --kb-bg: rgba(15, 23, 42, 0.9);
      --key-bg: rgba(255, 255, 255, 0.1);
      --key-hover: rgba(255, 255, 255, 0.2);
      --accent-blue: #38bdf8;
      --accent-purple: #a855f7;
      --text-main: #f8fafc;
    }

    .math-keyboard {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 800px;
      background: var(--kb-bg);
      backdrop-filter: blur(15px);
      border-top: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px 20px 0 0;
      padding: 15px;
      box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
      z-index: 2000;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .math-keyboard.hidden { transform: translate(-50%, 100%); }

    .keyboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      color: var(--text-main);
    }

    .keyboard-row { display: flex; gap: 8px; margin-bottom: 8px; justify-content: center; }

    .math-key {
      flex: 1;
      height: 54px;
      border: none;
      border-radius: 10px;
      background: var(--key-bg);
      color: var(--text-main);
      font-size: 1.25rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .math-key:hover { background: var(--key-hover); }
    .math-key.fn { color: var(--accent-blue); }
    .math-key.var { color: var(--accent-purple); font-style: italic; }
    .math-key.op { background: rgba(56, 189, 248, 0.1); color: var(--accent-blue); }
    .math-key.ctrl { background: rgba(239, 68, 68, 0.1); color: #f87171; }
    .math-key.wide { flex: 2; }
    
    .kb-toggle {
      background: var(--accent-blue);
      color: white;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 2px 8px;
      cursor: pointer;
      margin-left: 5px;
      font-size: 16px;
      vertical-align: middle;
      transition: all 0.3s ease;
    }
    
    .kb-toggle.inactive {
      background: #6c757d;
      opacity: 0.7;
    }
    .delta-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .delta-input {
      width: 120px;
      padding: 5px;
      text-align: center;
    }

    .remove-btn {
      background-color: #dc3545;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
    }

    .add-btn {
      background-color: #28a745;
      color: white;
      border: none;
      padding: 5px 15px;
      border-radius: 4px;
      cursor: pointer;
      margin-bottom: 20px;
    }
  </style>
</head>

<body>
  <div id="sidebar-placeholder"></div>
  <script>
    fetch('/static/partials/sidebar.html')
      .then(res => res.text())
      .then(html => {
        document.getElementById('sidebar-placeholder').innerHTML = html;

        window.openNav = function () {
          const sidebar = document.getElementById("mySidebar");
          if (sidebar) sidebar.style.width = "250px";
        };

        window.closeNav = function () {
          const sidebar = document.getElementById("mySidebar");
          if (sidebar) sidebar.style.width = "0";
        };
      });
  </script>
  <div id="main">
    <div style="display: flex; align-items: flex-start; gap: 10px; margin-bottom: 0px;">
      <button class="openbtn" onclick="openNav()" style="padding-top: 0px;">☰</button>
      <div>
        <h2 style="margin: 0; font-size: 25px;">Da Problema Delta a Sistema</h2>
        <p class="description">
          Inserisci le specifiche delle funzioni delta e l'equazione finale \( y(t) \), includendo le costanti
          direttamente come moltiplicatori (es. c1, 5).
        </p>
      </div>
    </div>
  </div>

  <div class="container" style="max-width: 800px;">

    <div style="margin-top: 20px; text-align: center;">
      <h4>Specifiche delle funzioni Delta</h4>
      <div id="delta-container">
        <!-- Righe aggiunte dinamicamente -->
      </div>
      <button class="add-btn" onclick="addDeltaRow()">+ Aggiungi Delta</button>
    </div>



    <div style="margin-top: 20px; text-align: center;">
      <h4>Equazione</h4>
      <span style="font-size: 20px; margin: 0 10px;">\( y(t) = \)</span>
      <input id="equationInput" type="text" placeholder="es. d(t-1)*c1+d(t)*c2"
        style="width: 350px; font-size: 18px; text-align: center; padding: 5px;" readonly>
      <button class="kb-toggle" onclick="toggleKeyboardMode()" title="Attiva/Disattiva tastiera matematica">⌨️</button>
    </div>

    <div style="margin-top: 30px; text-align: center;">
      <button onclick="calcolaSistema()" style="padding: 10px 30px; font-size: 18px;">Risolvi</button>
    </div>

    <div class="container" style="margin-top: 30px;">
      <main class="content">
        <div id="output" class="output" style="margin-top:0px;">
          <p style="text-align:center; color:#888; font-style:italic;">In attesa di input...</p>
        </div>
      </main>
    </div>

    <!-- Struttura Tastiera -->
    <div id="math-keyboard" class="math-keyboard hidden">
      <div class="keyboard-header">
        <span style="font-weight: bold; margin-left: 10px;">Tastiera Matematica</span>
        <button onclick="toggleKeyboard()" class="btn btn-sm btn-outline-danger">Chiudi</button>
      </div>
      
      <div class="keyboard-body">
        <div class="keyboard-row">
          <button class="math-key fn" onclick="insertMath('d(')">d(t)</button>
          <button class="math-key fn" onclick="insertMath('exp(')">eˣ</button>
          <button class="math-key fn" onclick="insertMath('log(')">ln</button>
          <button class="math-key fn" onclick="insertMath('sqrt(')">√</button>
          <button class="math-key var" onclick="insertMath('t')">t</button>
        </div>
        <div class="keyboard-row">
          <button class="math-key var" onclick="insertMath('c1')">c₁</button>
          <button class="math-key var" onclick="insertMath('c2')">c₂</button>
          <button class="math-key var" onclick="insertMath('c3')">c₃</button>
          <button class="math-key var" onclick="insertMath('c4')">c₄</button>
        </div>
        <div class="keyboard-row">
          <button class="math-key num" onclick="insertMath('7')">7</button>
          <button class="math-key num" onclick="insertMath('8')">8</button>
          <button class="math-key num" onclick="insertMath('9')">9</button>
          <button class="math-key op" onclick="insertMath('/')">÷</button>
          <button class="math-key op" onclick="insertMath('^')">xʸ</button>
          <button class="math-key ctrl" onclick="backspace()">⌫</button>
        </div>
        <div class="keyboard-row">
          <button class="math-key num" onclick="insertMath('4')">4</button>
          <button class="math-key num" onclick="insertMath('5')">5</button>
          <button class="math-key num" onclick="insertMath('6')">6</button>
          <button class="math-key op" onclick="insertMath('*')">×</button>
          <button class="math-key op" onclick="insertMath('(')">(</button>
          <button class="math-key op" onclick="insertMath(')')">)</button>
        </div>
        <div class="keyboard-row">
          <button class="math-key num" onclick="insertMath('1')">1</button>
          <button class="math-key num" onclick="insertMath('2')">2</button>
          <button class="math-key num" onclick="insertMath('3')">3</button>
          <button class="math-key op" onclick="insertMath('-')">−</button>
          <button class="math-key op" onclick="insertMath('+')">+</button>
          <button class="math-key num" onclick="insertMath('0')">0</button>
        </div>
        <div class="keyboard-row">
          <button class="math-key num" onclick="insertMath('.')">.</button>
          <button class="math-key ctrl wide" onclick="clearInput()">CANC</button>
          <button class="math-key op wide" onclick="calcolaSistema(); toggleKeyboard();">RISOLVI</button>
        </div>
      </div>
    </div>

    <script>
      let deltaCounter = 0;

      function addDeltaRow(timeExpr = "t", activeAt = "0") {
        deltaCounter++;
        const container = document.getElementById("delta-container");
        const row = document.createElement("div");
        row.className = "delta-row";
        row.id = `delta-row-${deltaCounter}`;

        row.innerHTML = `
          <span>Espressione: d(</span>
          <input type="text" class="delta-input time-expr" value="${timeExpr}" placeholder="es. t-1" ${isKeyboardActive ? 'readonly' : ''}>
          <span>)</span>
          <span style="margin-left: 20px;">Attiva (vale 1) a: t =</span>
          <input type="number" class="delta-input active-at" value="${activeAt}">
          <button class="remove-btn" onclick="removeDeltaRow(${deltaCounter})" style="margin-left: 10px;">X</button>
        `;

        // Aggiungi listener per la tastiera
        row.querySelector('.time-expr').addEventListener('focus', function() {
          if (isKeyboardActive) {
            activeInput = this;
            document.getElementById('math-keyboard').classList.remove('hidden');
          }
        });

        container.appendChild(row);
      }

      function removeDeltaRow(id) {
        const row = document.getElementById(`delta-row-${id}`);
        if (row) {
          row.remove();
        }
      }

      // Aggiungiamo due righe di default all'avvio
      window.onload = () => {
        addDeltaRow("t", "0");
        addDeltaRow("t-1", "1");
      };

      function calcolaSistema() {
        const output = document.getElementById("output");

        // Raccolta Delta
        const deltaSpecs = [];
        const rows = document.querySelectorAll('.delta-row');
        rows.forEach(row => {
          const timeExpr = row.querySelector('.time-expr').value.trim();
          const activeAt = row.querySelector('.active-at').value.trim();
          if (timeExpr && activeAt !== "") {
            deltaSpecs.push({ time_expr: timeExpr, active_at: activeAt });
          }
        });

        const equation = document.getElementById("equationInput").value.trim();

        if (deltaSpecs.length === 0) {
          output.innerHTML = `<p style="color:red; text-align:center;">Inserire almeno una funzione Delta</p>`;
          return;
        }
        if (!equation) {
          output.innerHTML = `<p style="color:red; text-align:center;">Inserire l'equazione</p>`;
          return;
        }

        output.innerHTML = `<p style="text-align:center; color:#888; font-style:italic;">Calcolo in corso...</p>`;

        fetch('/api/delta_da_problema_a_soluzione', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            delta_specs: deltaSpecs,
            equation: equation
          })
        })
          .then(async r => {
            const contentType = r.headers.get("content-type");
            if (!r.ok || !contentType || !contentType.includes("application/json")) {
              const text = await r.text();
              throw new Error(`Risposta non valida dal server: ${text.slice(0, 100)}...`);
            }
            return r.json();
          })
          .then(res => {
              if (!res.success) {
                output.innerHTML = `<p style="color:red; text-align:center;">${res.error || "Errore sconosciuto"}</p>`;
              } else {
                output.innerHTML = "";
                const data = res.data;

                // 1. EQUAZIONE FINALE E MATRICI (RIASSUNTO) - PRIMA COSA CHE SI VEDE
                let summaryHtml = "";
                
                if (data.difference_equation) {
                  summaryHtml += `
                    <div style="margin-bottom: 30px;">
                      ${data.difference_equation}
                    </div>
                  `;
                }

                if (data.matrices) {
                  summaryHtml += `
                    <div style="margin-top: 20px; padding: 25px; border: 2px solid #28a745; border-radius: 12px; background-color: #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
                        <h3 style="text-align: center; color: #28a745; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 1px;">Rappresentazione in Spazio di Stato</h3>
                        <div>${data.matrices}</div>
                    </div>
                  `;
                }

                if (summaryHtml) {
                  output.innerHTML += `
                    <div id="result-summary" style="margin-bottom: 50px;">
                      <h2 style="text-align: center; color: #333; margin-bottom: 30px; font-weight: bold;">Risultato Finale</h2>
                      ${summaryHtml}
                      <hr style="margin: 40px 0; border-top: 3px double #bbb;">
                    </div>
                  `;
                }

                // 2. PASSAGGI DETTAGLIATI
                if (data.steps && Array.isArray(data.steps)) {
                  output.innerHTML += `<h2 style="text-align: center; color: #555; margin-bottom: 30px;">Svolgimento Passo-Passo</h2>`;
                  let stepCounter = 1;
                  data.steps.forEach((step) => {
                    let contentHtml = step.is_html ? step.content : `<p class="centered-math">\\[${step.content}\\]</p>`;
                    output.innerHTML += `
                      <div class="step-container" style="margin-bottom: 30px; padding: 15px; border-left: 4px solid #007bff; background: #fcfcfc;">
                        <p class="step-title" style="font-size: 1.1rem; color: #007bff;"><b>Passaggio ${stepCounter++}:</b> ${step.title}</p>
                        ${contentHtml}
                      </div>
                    `;
                  });
                }

                // 3. VARIABILI DI STATO (Se non incluse nei passaggi)
                if (data.state_variables && !output.innerHTML.includes(data.state_variables)) {
                  output.innerHTML += `
                    <div style="margin-top: 30px; padding: 15px; border: 1px solid #dee2e6; border-radius: 8px; background: #f8f9fa;">
                        <h4 style="text-align: center;">Legenda Variabili di Stato</h4>
                        <div style="font-size: 1.1em; display: flex; justify-content: center;">${data.state_variables}</div>
                    </div>
                  `;
                }

              MathJax.typesetPromise([output]);
            }
          })
          .catch(err => {
            output.innerHTML = `<p style="color:red; text-align:center;">${err.message || "Errore sconosciuto"}</p>`;
          });
      }
  
      // --- LOGICA TASTIERA ---
      let isKeyboardActive = true;
      let activeInput = null;

      function toggleKeyboardMode() {
        isKeyboardActive = !isKeyboardActive;
        const keyboard = document.getElementById('math-keyboard');
        const allInputs = document.querySelectorAll('input[type="text"]');
        const toggleBtns = document.querySelectorAll('.kb-toggle');

        if (isKeyboardActive) {
          allInputs.forEach(input => input.setAttribute('readonly', true));
          toggleBtns.forEach(btn => btn.classList.remove('inactive'));
        } else {
          allInputs.forEach(input => input.removeAttribute('readonly'));
          toggleBtns.forEach(btn => btn.classList.add('inactive'));
          keyboard.classList.add('hidden');
          if (activeInput) activeInput.focus();
        }
      }

      function insertMath(val) {
        if (!isKeyboardActive || !activeInput) return;
        let start = activeInput.selectionStart;
        let end = activeInput.selectionEnd;
        let text = activeInput.value;
        let insertion = val;
        let cursorOffset = 0;

        if (val === '^') {
          insertion = '^()';
          cursorOffset = -1;
        } else if (val.endsWith('(')) {
          insertion = val + ')';
          cursorOffset = -1;
        }

        activeInput.value = text.substring(0, start) + insertion + text.substring(end);
        const newPos = start + insertion.length + cursorOffset;
        activeInput.setSelectionRange(newPos, newPos);
        activeInput.focus();
      }

      function backspace() {
        if (!activeInput) return;
        let start = activeInput.selectionStart;
        if (start > 0) {
          activeInput.value = activeInput.value.substring(0, start - 1) + activeInput.value.substring(start);
          activeInput.setSelectionRange(start - 1, start - 1);
        }
        activeInput.focus();
      }

      function clearInput() {
        if (!activeInput) return;
        activeInput.value = "";
        activeInput.focus();
      }

      function toggleKeyboard() {
        // Per il tasto "Chiudi"
        document.getElementById('math-keyboard').classList.add('hidden');
      }

      // Listener per input equazione
      document.getElementById("equationInput").addEventListener("focus", function() {
        if (isKeyboardActive) {
          activeInput = this;
          document.getElementById('math-keyboard').classList.remove('hidden');
        }
      });
    </script>
</body>

</html>
