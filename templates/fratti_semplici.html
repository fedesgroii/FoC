<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <title>Fratti Semplici | FoC</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body {
            font-family: Georgia, serif;
            background-color: #1e1e1e !important;
            color: #ddd !important;
        }

        .container {
            height: auto;
            min-height: 100vh;
        }

        .fraction-input-container {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 40px;
            justify-content: center;
        }

        .fraction-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .fraction-box input {
            width: 400px;
            font-size: 20px;
            text-align: center;
            padding: 10px;
            border: 1px solid #444;
            border-radius: 8px;
            background-color: #2a2a2a !important;
            color: #fff !important;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .fraction-box input:focus {
            border-color: #007bff;
            box-shadow: 0 0 8px rgba(0, 123, 255, 0.4);
        }

        .fraction-line {
            width: 100%;
            height: 3px;
            background-color: #555;
            border-radius: 2px;
        }

        .solve-btn {
            margin-top: 40px;
            padding: 12px 30px;
            font-size: 18px;
            background-color: #007bff !important;
            border: none !important;
            border-radius: 6px;
            color: white !important;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .solve-btn:hover {
            background-color: #0056b3 !important;
        }

        #output {
            background-color: #ffffff; /* Sfondo bianco per il testo matematico come nelle altre pagine */
            color: #1e1e1e !important;
            border-radius: 12px;
            padding: 30px;
            margin-top: 40px;
            max-width: 850px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            margin-left: auto;
            margin-right: auto;
        }

        .step-container {
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
        }

        .step-container:last-child {
            border-bottom: none;
        }

        .step-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #007bff;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .initial-step .step-title {
            color: #555;
        }

        .final-step {
            background-color: #f0fff4;
            border: 2px solid #28a745;
            border-radius: 10px;
            padding: 20px;
        }

        .final-step .step-title {
            color: #28a745;
        }
        
        .math-content {
            font-size: 1.2rem;
            overflow-x: auto;
        }
    </style>
</head>

<body>
    <div id="sidebar-placeholder"></div>
    <script>
        fetch('/static/partials/sidebar.html')
            .then(res => res.text())
            .then(html => {
                document.getElementById('sidebar-placeholder').innerHTML = html;

                window.openNav = function () {
                    const sidebar = document.getElementById("mySidebar");
                    if (sidebar) sidebar.style.width = "250px";
                };

                window.closeNav = function () {
                    const sidebar = document.getElementById("mySidebar");
                    if (sidebar) sidebar.style.width = "0";
                };
            });
    </script>

    <div id="main">
        <div style="display: flex; align-items: flex-start; gap: 15px; margin-bottom: 20px;">
            <button class="openbtn" onclick="openNav()">☰</button>
            <div>
                <h2 style="margin: 0; font-size: 28px; color: #fff;">Decomposizione in Fratti Semplici</h2>
                <p class="description" style="color: #bbb; margin-top: 5px;">
                    Risoluzione passo-passo di frazioni razionali \( F(x) = \frac{N(x)}{D(x)} \).
                </p>
            </div>
        </div>

        <div class="container">
            <div class="fraction-input-container">
                <span style="font-size: 30px; font-weight: bold; color: #fff;">\( F(x) = \)</span>
                <div class="fraction-box">
                    <input id="numInput" type="text" placeholder="Numeratore (es. 2x + 1)" autocomplete="off">
                    <div class="fraction-line"></div>
                    <input id="denInput" type="text" placeholder="Denominatore (es. x^2 + x)" autocomplete="off">
                </div>
            </div>

            <div style="text-align: center;">
                <button class="solve-btn" onclick="calcolaFratti()">Risolvi Ora</button>
            </div>

            <div id="output">
                <p style="text-align:center; color:#888; font-style:italic; font-size: 18px;">
                    Inserisci i polinomi per visualizzare la risoluzione...
                </p>
            </div>
        </div>
    </div>

    <script>
        function calcolaFratti() {
            const output = document.getElementById("output");
            const numerator = document.getElementById("numInput").value.trim();
            const denominator = document.getElementById("denInput").value.trim();

            if (!numerator || !denominator) {
                output.innerHTML = `<p style="color:#d9534f; text-align:center; font-weight:bold;">Errore: Inserire sia il numeratore che il denominatore.</p>`;
                return;
            }

            output.innerHTML = `<div style="text-align:center; padding: 40px;">
                <div class="spinner-border text-primary" role="status"></div>
                <p style="margin-top:15px; color:#555;">Calcolo in corso e generazione passaggi...</p>
            </div>`;

            fetch('/api/fratti_semplici', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ numerator: numerator, denominator: denominator })
            })
            .then(r => r.json())
            .then(res => {
                if (!res.success) {
                    output.innerHTML = `<p style="color:#d9534f; text-align:center; padding: 20px; font-weight:bold;">Errore: ${res.error || "Errore sconosciuto"}</p>`;
                } else {
                    output.innerHTML = "";
                    if (res.latex && Array.isArray(res.latex)) {
                        res.latex.forEach((step, index) => {
                            const stepDiv = document.createElement("div");
                            stepDiv.className = "step-container";
                            
                            if (step.type === "initial") {
                                stepDiv.classList.add("initial-step");
                            } else if (step.type === "final") {
                                stepDiv.classList.add("final-step");
                            }

                            const title = document.createElement("p");
                            title.className = "step-title";
                            title.innerHTML = `Passo ${index}: ${step.title}`;
                            stepDiv.appendChild(title);

                            const mathDiv = document.createElement("div");
                            mathDiv.className = "math-content centered-math";
                            mathDiv.innerHTML = `\\[ ${step.content} \\]`;
                            stepDiv.appendChild(mathDiv);

                            output.appendChild(stepDiv);
                        });
                    }
                    MathJax.typesetPromise([output]);
                }
            })
            .catch(err => {
                output.innerHTML = `<p style="color:#d9534f; text-align:center; padding: 20px; font-weight:bold;">Errore di connessione: ${err.message}</p>`;
            });
        }

        // Event listener per tasto Invio
        [document.getElementById("numInput"), document.getElementById("denInput")].forEach(el => {
            el.addEventListener("keypress", function (event) {
                if (event.key === "Enter") {
                    event.preventDefault();
                    calcolaFratti();
                }
            });
        });
    </script>
</body>

</html>
